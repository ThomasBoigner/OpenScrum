<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(~{::title}, ~{::link})}">
    <title>Update a project</title>
    <link rel="stylesheet" th:href="@{/css/pages/update-project.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/form-field.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/submit-button.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/error-message.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/developer-list-item.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <section id="hero">
        <a th:href="@{/projects}">
            <img th:src="@{/assets/svg/logo.svg}" alt="Logo">
        </a>
        <h1>Update the Project!</h1>
    </section>
    <section id="project-form">
        <form method="post" th:action="@{/projects/{projectId}/update(projectId=${projectId})}" th:object="${updateProjectForm}">
            <div th:replace="~{fragments/error-message :: form-errors}"></div>
            <div class="input-fields">
                <th:block th:replace="~{fragments/form-field :: text-field('project-name', 'Project name:', 'projectName', *{projectName}, 'Update the project name!')}"></th:block>
                <th:block th:replace="~{fragments/form-field :: user-select-field('product-owner', 'Product Owner:', 'productOwnerId', *{productOwnerId}, 'Update the product owner!')}"></th:block>
                <th:block th:replace="~{fragments/form-field :: user-select-field('scrum-master', 'Scrum Master:', 'scrumMasterId', *{scrumMasterId}, 'Update the scrum master!')}"></th:block>
            </div>
            <div id="developers">
                <h4>Update the Developers:</h4>
                <div class="developer-item-list">
                    <p hx:get="@{/projects/developer-list(developerIds=*{developerIds})}"
                       hx-trigger="load"
                       hx-swap="outerHTML">Could not load users!</p>
                </div>
            </div>
            <button th:replace="~{fragments/submit-button :: submit-button('Update the Project', 'check-white.svg', 'check')}"></button>
        </form>
    </section>
</div>
</body>
</html>

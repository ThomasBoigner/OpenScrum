<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Update a project</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/svg/logo.svg}"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/pages/update-project.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <section id="hero">
        <a th:href="@{/projects}">
            <img th:src="@{/assets/svg/logo.svg}" alt="Logo">
        </a>
        <h1>Update the Project!</h1>
    </section>
    <section id="project-form">
        <form method="post" th:action="@{/projects/{projectId}/update(projectId=${projectId})}" th:object="${updateProjectForm}">
            <div class="error-message" th:if="${#fields.hasErrors() || errorMessage != null}">
                <img th:src="@{/assets/svg/exclamation-mark.svg}" alt="exclamation mark">
                <p th:if="${errorMessage}" th:text="${errorMessage}">Error while updating project!</p>
                <div>
                    <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
                </div>
            </div>
            <div class="input-fields">
                <label for="project-name">Project name:</label>
                <input type="text" id="project-name" th:field="*{projectName}" placeholder="Update the project name!">
                <label for="product-owner">Product Owner:</label>
                <select id="product-owner" th:field="*{productOwnerId}">
                    <option value="">Update the product owner!</option>
                    <option th:each="user : ${users}"
                            th:value="${user.userId}"
                            th:text="${user.fullName}"></option>
                </select>
                <label for="scrum-master">Scrum Master:</label>
                <select id="scrum-master" th:field="*{scrumMasterId}">
                    <option value="">Update the scrum master!</option>
                    <option th:each="user : ${users}"
                            th:value="${user.userId}"
                            th:text="${user.fullName}"></option>
                </select>
            </div>
            <div id="developers">
                <h4>Update the Developers:</h4>
                <div class="developer-item-list">
                    <div class="developer-item" th:each="user : ${users}">
                        <input th:id="|select-developer-${user.userId}|" type="checkbox" th:field="*{developerIds}" th:value="${user.userId}">
                        <h5>
                            <label th:for="|select-developer-${user.userId}|" th:text="${user.fullName}">Thomas Boigner</label>
                        </h5>
                    </div>
                </div>
            </div>
            <button type="submit">
                Update the Project
                <img th:src="@{/assets/svg/check-white.svg}" alt="check">
            </button>
        </form>
    </section>
</div>
</body>
</html>

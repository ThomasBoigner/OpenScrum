<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(~{::title}, ~{::link})}">
    <title>Register a user</title>
    <link rel="stylesheet" th:href="@{/css/pages/register-user.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/form-field.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/submit-button.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/error-message.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <section id="hero">
        <a th:href="@{/projects}">
            <img th:src="@{/assets/svg/logo.svg}" alt="Logo">
        </a>
        <h1>Register a user!</h1>
    </section>
    <section id="registration-form" >
        <form th:action="@{/users/register}" th:object="${registerUserForm}" method="post">
            <div th:replace="~{fragments/error-message :: form-errors}"></div>
            <div class="input-fields">
                <th:block th:replace="~{fragments/form-field :: text-field('username', 'Username:', 'username', *{username}, 'Enter the username!')}"></th:block>
                <th:block th:replace="~{fragments/form-field :: text-field('first-name', 'First name:', 'firstName', *{firstName}, 'Enter the first name!')}"></th:block>
                <th:block th:replace="~{fragments/form-field :: text-field('last-name', 'Last name:', 'lastName', *{lastName}, 'Enter the last name!')}"></th:block>
                <th:block th:replace="~{fragments/form-field :: text-field('email-address', 'Email address:', 'email', *{email}, 'Enter the email address!')}"></th:block>
                <th:block th:replace="~{fragments/form-field :: password-field('password', 'Password:', 'password', 'Enter the password!')}"></th:block>
            </div>
            <button th:replace="~{fragments/submit-button :: submit-button('Register', 'plus.svg', 'plus')}"></button>
        </form>
    </section>
</div>
</body>
</html>

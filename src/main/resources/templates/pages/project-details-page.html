<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(~{::title}, ~{::link})}">
    <title>Project details page</title>
    <link rel="stylesheet" th:href="@{/css/pages/project-details-page.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/detail-card.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/scrum-header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/floating-action-button.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body th:object="${project}">
<div class="container">
    <header th:replace="~{fragments/scrum-header :: scrum-header(${project.projectId}, 'details')}"></header>

    <section id="project-details">
        <h1 class="project-title" th:text="*{projectName}">Project Name</h1>

        <div class="details-grid">
            <div class="details-row">
                <div th:replace="~{fragments/detail-card :: detail-card-with-content('team.svg', 'Team', ~{::team-content})}">
                    <th:block th:fragment="team-content">
                        <div class="team-info">
                            <div class="info-group">
                                <label>Scrum Master</label>
                                <p th:text="${scrumMaster.fullName}">John Doe</p>
                            </div>
                            <div class="info-group">
                                <label>Product Owner</label>
                                <p th:text="${productOwner.fullName}">John Doe</p>
                            </div>
                            <div class="info-group">
                                <label>Sprint Length</label>
                                <p th:text="|*{sprintLength} weeks|">2 weeks</p>
                            </div>
                        </div>
                    </th:block>
                </div>

                <th:block th:if="${!#lists.isEmpty(developers)}">
                    <div th:replace="~{fragments/detail-card :: detail-card-with-content('dev.svg', 'Dev', ~{::developers-content})}">
                        <th:block th:fragment="developers-content">
                            <label>Developers</label>
                            <div class="developers-list">
                                <p th:each="developer : ${developers}" th:text="${developer.fullName}">Maria Garcia</p>
                            </div>
                        </th:block>
                    </div>
                </th:block>
            </div>

            <div class="details-row">
                <th:block th:if="*{productGoal != null}">
                    <div th:replace="~{fragments/detail-card :: detail-card('rocket.svg', 'Rocket', 'Product Goal', *{productGoal})}"></div>
                </th:block>

                <th:block th:if="*{definitionOfDone != null}">
                    <div th:replace="~{fragments/detail-card :: detail-card('check.svg', 'Check', 'Definition of Done', *{definitionOfDone})}"></div>
                </th:block>
            </div>
        </div>

        <th:block th:if="${authenticatedTeamMember.isProductOwner || authenticatedTeamMember.isScrumMaster}">
            <a th:replace="~{fragments/floating-action-button :: floating-action-button(@{/projects/{projectId}/configure(projectId=*{projectId})}, 'gear.svg', 'Gear', 'secondary')}"></a>
        </th:block>
    </section>
</div>
</body>
</html>

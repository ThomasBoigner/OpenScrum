<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">
<head th:replace="~{layout/head :: head(~{::title}, ~{::link})}">
    <title>List Users</title>
    <link rel="stylesheet" th:href="@{/css/pages/list-users.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/users-list-item.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <header id="main-header">
        <a th:href="@{/projects}">
            <img th:src="@{/assets/svg/logo.svg}" alt="Logo">
        </a>
        <nav>
            <a class="btn" th:href="@{/projects}">
                <img th:src="@{/assets/svg/project.svg}" alt="Project">
                Projects
            </a>
            <a class="btn selected" th:href="@{/users}">
                <img th:src="@{/assets/svg/user-white.svg}" alt="User">
                Users
            </a>
            <a class="btn" hx:post="@{/logout}">
                <img th:src="@{/assets/svg/exit.svg}" alt="Exit">
                Logout
            </a>
        </nav>
    </header>
    <section id="users-list">
        <div class="search-input">
            <label for="search-input"><img th:src="@{/assets/svg/search.svg}" alt="Search"></label>
            <input type="text" name="search-input" id="search-input" placeholder="Search">
        </div>
        <p hx:get="@{/users/list}" hx-trigger="load" hx-swap="outerHTML">Could not load users!</p>
        <a th:if="${authenticatedUser != null && authenticatedUser.role.isManager()}" class="create-button" th:href="@{/users/register}">
            <img th:src="@{/assets/svg/plus.svg}" alt="Plus">
        </a>
    </section>
</div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Define a product backlog item</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/svg/logo.svg}"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/pages/define-product-backlog-item.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <section id="hero">
        <a th:href="@{/projects}">
            <img th:src="@{/assets/svg/logo.svg}" alt="Logo">
        </a>
        <h1>Define a new product backlog item!</h1>
        <h3>Describe the work that needs to be done</h3>
    </section>
    <section id="define-product-backlog-item-form">
        <form method="post" th:action="@{/projects/{id}/backlog/define(id=${project.projectId})}" th:object="${defineProductBacklogItemForm}">
            <div class="error-message" th:if="${#fields.hasErrors() || errorMessage != null}">
                <img th:src="@{/assets/svg/exclamation-mark.svg}" alt="exclamation mark">
                <p th:text="${errorMessage}">Error while defining product backlog item!</p>
                <div>
                    <p th:each="err : ${#fields.allErrors()}" th:text="${err}">Validation error while defining product backlog item!</p>
                </div>
            </div>
            <div class="input-fields">
                <div class="label-input">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Enter the title of the product backlog item!" th:field="*{title}">
                </div>
                <div class="label-input">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Add a description to the product backlog item!" th:field="*{description}"></textarea>
                </div>
            </div>
            <div class="submit-go-back">
                <button type="submit">
                    Define item
                    <img th:src="@{/assets/svg/plus.svg}" alt="plus">
                </button>
                <p>Changed your mind? Go <a th:href="@{/projects/{id}/backlog(id=${project.projectId})}">back</a>!</p>
            </div>
        </form>
    </section>
</div>
</body>
</html>

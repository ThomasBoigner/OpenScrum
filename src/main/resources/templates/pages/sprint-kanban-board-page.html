<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(~{::title}, ~{::link})}">
    <title>Sprint kanban board</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/pages/sprint-kanban-board-page.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/sprint-header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/back-button.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/sprint-backlog-item.css}">
</head>
<body>
<div class="container" th:object="${sprint}">
    <header th:replace="~{fragments/sprint-header :: sprint-header(${sprint}, 'kanban-board')}"></header>

    <div id="kanban-board">
        <div class="kanban-column" id="todo-column">
            <h3>To-Do</h3>
            <p hx:get="@{/projects/{projectId}/sprints/{sprintId}/backlog-items(projectId=${sprint.projectId}, sprintId=${sprint.sprintId}, status='TO_DO')}"
               hx-trigger="load" hx-swap="outerHTML">Could not load sprint backlog items!</p>
        </div>

        <div class="kanban-column" id="in-progress-column">
            <h3>In progress</h3>
            <p hx:get="@{/projects/{projectId}/sprints/{sprintId}/backlog-items(projectId=${sprint.projectId}, sprintId=${sprint.sprintId}, status='IN_PROGRESS')}"
               hx-trigger="load" hx-swap="outerHTML">Could not load sprint backlog items!</p>
        </div>

        <div class="kanban-column" id="done-column">
            <h3>Done</h3>
            <p hx:get="@{/projects/{projectId}/sprints/{sprintId}/backlog-items(projectId=${sprint.projectId}, sprintId=${sprint.sprintId}, status='DONE')}"
               hx-trigger="load" hx-swap="outerHTML">Could not load sprint backlog items!</p>
        </div>
    </div>
</div>
</body>
</html>

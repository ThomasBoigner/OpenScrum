<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(~{::title}, ~{::link})}">
    <title>List Projects</title>
    <link rel="stylesheet" th:href="@{/css/pages/list-projects.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/main-header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/search-input.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/project-list-item.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <header th:replace="~{fragments/main-header :: main-header('projects')}"></header>
    <section id="projects-list">
        <div th:replace="~{fragments/search-input :: search-input}"></div>
        <p hx:get="@{/projects/list}" hx-trigger="load" hx-swap="outerHTML">Could not load projects!</p>
        <a th:if="${authenticatedUser != null && authenticatedUser.role.isManager()}" class="create-button" th:href="@{/projects/create}">
            <img th:src="@{/assets/svg/plus.svg}" alt="Plus">
        </a>
    </section>
</div>
</body>
</html>

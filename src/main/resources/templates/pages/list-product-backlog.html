<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(~{::title}, ~{::link})}">
    <title>Product Backlog</title>
    <link rel="stylesheet" th:href="@{/css/pages/list-product-backlog.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/scrum-header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/search-input.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/product-backlog-list-item.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body th:object="${project}">
<div class="container">
    <header th:replace="~{fragments/scrum-header :: scrum-header(${project.projectId}, 'backlog')}"></header>

    <section id="product-backlog">
        <div th:replace="~{fragments/search-input :: search-input}"></div>
        <p hx:get="@{/projects/{projectId}/backlog/list(projectId=*{projectId})}" hx-trigger="load" hx-swap="outerHTML">Could not load product backlog!</p>
        <a th:if="${authenticatedTeamMember.isProductOwner()}" class="add-button" th:href="@{/projects/{projectId}/backlog/define(projectId=*{projectId})}">
            <img th:src="@{/assets/svg/plus.svg}" alt="Add">
        </a>
    </section>
</div>
</body>
</html>

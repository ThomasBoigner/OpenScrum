<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(~{::title}, ~{::link})}">
    <title>Configure a project</title>
    <link rel="stylesheet" th:href="@{/css/pages/configure-project.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/saved-changes.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/error-message.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <section id="hero">
        <a th:href="@{/projects}">
            <img th:src="@{/assets/svg/logo.svg}" alt="Logo">
        </a>
        <h1>Configure the Project!</h1>
    </section>

    <section id="configure-form" th:object="${project}">
        <div id="message" class="display-none">
            Placeholder
        </div>

        <div class="input-fields">
            <form id="sprint-length-form" th:if="${authenticatedTeamMember.isScrumMaster}" hx:put="@{/projects/{projectId}/configure/sprint-length(projectId=*{projectId})}"
                  hx-target="div#message" hx-swap="outerHTML">
                <div class="label-input">
                    <label for="sprint-length">Sprint length:</label>
                    <input type="number" id="sprint-length" name="sprintLength"
                           placeholder="Enter the length of Sprints in weeks!" min="1" max="4"
                           th:value="*{sprintLength}">
                </div>
                <button type="submit">Save</button>
            </form>

            <form id="product-goal-form" th:if="${authenticatedTeamMember.isProductOwner}" hx:put="@{/projects/{projectId}/configure/product-goal(projectId=*{projectId})}"
                  hx-target="div#message" hx-swap="outerHTML">
                <div class="label-input">
                    <label for="product-goal">Product goal:</label>
                    <textarea id="product-goal" name="productGoal"
                              placeholder="Describe the product goal for this project!"
                              th:text="*{productGoal}"></textarea>
                </div>
                <button type="submit">Save</button>
            </form>

            <form id="definition-of-done-form" th:if="${authenticatedTeamMember.isScrumMaster()}" hx:put="@{/projects/{projectId}/configure/definition-of-done(projectId=*{projectId})}"
                  hx-target="div#message" hx-swap="outerHTML">
                <div class="label-input">
                    <label for="definition-of-done">Definition of done:</label>
                    <textarea id="definition-of-done" name="definitionOfDone"
                              placeholder="Describe when a task is considered done!"
                              th:text="*{definitionOfDone}"></textarea>
                </div>
                <button type="submit">Save</button>
            </form>
        </div>

        <a class="btn" th:href="@{/projects/{projectId}(projectId=*{projectId})}">
            <img th:src="@{/assets/svg/arrow-white.svg}" alt="Arrow">
            Back
        </a>
    </section>
</div>
</body>
</html>

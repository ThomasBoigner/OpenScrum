<p th:if="${userPage.empty && userPage.first}">No users found!</p>
<div class="developer-item" th:each="user : ${userPage.content}" th:object="${user}">
    <input th:id="|select-developer-*{userId}|"
           type="checkbox"
           name="developerIds"
           th:value="*{userId}"
           th:checked="${#sets.contains(developerIds, user.userId)}">
    <h5>
        <label th:for="|select-developer-*{userId}|" th:text="*{fullName}">Thomas Boigner</label>
    </h5>
</div>
<p th:unless="${userPage.last}"
   hx:get="@{/projects/developer-list(developerIds=${developerIds}, page=${userPage.number + 1})}"
   hx-trigger="intersect once"
   hx-swap="outerHTML"
   xmlns:hx="http://www.w3.org/1999/xhtml"
>
    Loading more users...
</p>

<p th:if="${#lists.isEmpty(sprints)}">No users found!</p>
<div th:fragment="sprint-list-item" class="sprint-list-item" th:each="sprint : ${sprints}" th:object="${sprint}">
    <div class="sprint-information">
        <h2 th:text="*{}">Sprint 1</h2>
        <div class="sprint-status">
            <label>Status</label>
            <p>In progress</p>
        </div>
    </div>
    <a class="sprint-details-button">
        <img th:src="@{/assets/svg/arrow-primary.svg}" alt="arrow">
    </a>
</div>

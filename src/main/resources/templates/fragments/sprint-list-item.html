<p th:if="${sprintPage.empty && sprintPage.first}">No sprints found!</p>
<div th:fragment="sprint-list-item" class="sprint-list-item" th:each="sprint : ${sprintPage.content}" th:object="${sprint}">
    <div class="sprint-information">
        <h2 th:text="*{sprintName}">Sprint 1</h2>
        <div class="sprint-status">
            <label>Status</label>
            <p th:text="*{status.displayName}">In progress</p>
        </div>
    </div>
    <a class="btn sprint-details-button" th:href="@{/projects/{projectId}/sprints/{sprintId}(projectId=*{projectId}, sprintId=*{sprintId})}">
        <img th:src="@{/assets/svg/arrow-primary.svg}" alt="arrow">
    </a>
</div>
<p th:unless="${sprintPage.last}"
   hx:get="@{/projects/{projectId}/sprints/list(projectId=${projectId}, query=${param.query}, page=${sprintPage.number + 1})}"
   hx-trigger="intersect once"
   hx-swap="outerHTML"
   xmlns:hx="http://www.w3.org/1999/xhtml"
>
    Loading more sprints...
</p>

<p class="no-product-backlog-item" th:if="${productBacklogPage.empty && productBacklogPage.first}">No product backlog items found!</p>
<div class="product-backlog-item" th:each="productBacklogItem : ${productBacklogPage.content}" th:object="${productBacklogItem}">
    <input th:id="|select-backlog-item-*{productBacklogItemId}|"
           type="checkbox"
           name="productBacklogIds"
           th:value="*{productBacklogItemId}"
           th:checked="${#sets.contains(productBacklogIds, productBacklogItem.productBacklogItemId)}">
    <div class="backlog-item-info">
        <h2>
            <label th:for="|select-backlog-item-*{productBacklogItemId}|" th:text="*{title}">Item Title</label>
        </h2>
        <div class="info-group">
            <label>Description</label>
            <p th:text="*{description}">Item description goes here.</p>
        </div>
    </div>
</div>
<p th:unless="${productBacklogPage.last}"
   hx:get="@{/projects/{projectId}/backlog/sprint-planning-list(projectId=${projectId}, productBacklogIds=${productBacklogIds}, page=${productBacklogPage.number + 1})}"
   hx-trigger="intersect once"
   hx-swap="outerHTML"
   xmlns:hx="http://www.w3.org/1999/xhtml"
>
    Loading more product backlog items...
</p>

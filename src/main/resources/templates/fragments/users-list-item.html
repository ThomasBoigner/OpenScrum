<p th:if="${#lists.isEmpty(users)}">No users found!</p>
<div th:id="|user-*{userId}|"
     th:fragment="users-list-item"
     th:each="user : ${users}"
     th:object="${user}"
     class="users-list-item"
     xmlns:hx="http://www.w3.org/1999/xhtml">
    <div class="user-information">
        <h2 th:text="*{username}">Username</h2>
        <div class="person-information">
            <label>Name</label>
            <p th:text="*{fullName}">Thomas Boigner</p>
            <label>E-mail</label>
            <p th:text="*{emailAddress}">thomasboigner@gmail.com</p>
            <label>Role</label>
            <p th:text="*{role.displayName}">User</p>
        </div>
    </div>
    <div class="promote-edit-delete-buttons">
        <a class="btn promote-button" th:if="${authenticatedUser.role.isManager()}">
            <img th:src="@{/assets/svg/arrow-primary.svg}" alt="Promote">
        </a>
        <a class="btn edit-button" th:if="${authenticatedUser.role.isManager()}">
            <img th:src="@{/assets/svg/edit.svg}" alt="Edit">
        </a>
        <a class="btn delete-button"
                th:if="*{deletable}"
                hx:delete="@{/users/{userId}/delete(userId=*{userId})}"
                hx-trigger="click"
                hx-swap="delete"
                hx:target="|#user-*{userId}|">
            <img th:src="@{/assets/svg/trash.svg}" alt="Trash">
        </a>
    </div>
</div>

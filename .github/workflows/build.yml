name: Kotlin CI with Gradle
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Build with Gradle
        run: ./gradlew build
